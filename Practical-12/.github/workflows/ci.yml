name: Full-Stack TaskFlow CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ===========================================================================
  # 1. Backend CI: Integration Tests with MongoDB Service Container
  # ===========================================================================
  backend-ci:
    name: Backend Tests & Caching / Events Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5099
      MONGO_URI: mongodb://127.0.0.1:27017/task_manager_test
      JWT_SECRET: supersecret_ci_test_jwt_key_charusat_24cs095
      JWT_EXPIRES_IN: 1h
      CACHE_TTL_SECONDS: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run CI Fast Unit & Cache Validation Tests
        working-directory: ./backend
        run: node test_ci.js

      - name: Run Practical 9 In-Memory Caching & Invalidation Test Suite
        working-directory: ./backend
        run: node test_cache.js

      - name: Run Practical 10 Decoupled EventEmitter Test Suite
        working-directory: ./backend
        run: node test_events.js

  # ===========================================================================
  # 2. Frontend CI: Linting & Production Vite Bundle Build
  # ===========================================================================
  frontend-ci:
    name: Frontend Linting & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint frontend code
        working-directory: ./frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build

  # ===========================================================================
  # 3. Docker Compose Configuration Validation
  # ===========================================================================
  docker-validation:
    name: Docker Compose Syntax & Spec Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml configuration
        run: docker compose config
